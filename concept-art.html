    <style>
        .gallery-container {
            width: 100%;
            margin: 0;
            padding: 0;
        }
        
        .project-section {
            width: 100%;
            height: 80vh;
            min-height: 600px;
            position: relative;
            margin: 20px 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .project-title {
            position: absolute;
            top: 30px;
            left: 50px;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            font-family: Arial, sans-serif;
        }
        
        .image-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            filter: blur(20px) brightness(0.6);
            transform: scale(1.1);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .background-image.active {
            opacity: 1;
        }
        
        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 5;
        }
        
        .gallery-image.active {
            opacity: 1;
        }
        
        .nav-arrow {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15%;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0;
            z-index: 20;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-arrow:hover {
            background: rgba(0,0,0,0.1);
        }
        
        .nav-arrow::after {
            content: '';
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .nav-arrow.prev::after {
            content: '‹';
        }
        
        .nav-arrow.next::after {
            content: '›';
        }
        
        .nav-arrow:hover::after {
            background: rgba(255,255,255,1);
        }
        
        .nav-arrow.prev {
            left: 0;
        }
        
        .nav-arrow.next {
            right: 0;
        }
        
        .image-counter {
            position: absolute;
            bottom: 30px;
            right: 50px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>

    <script>
        let autoSlideIntervals = new Map();

        function initializeGallery() {
            const sections = document.querySelectorAll('.project-section');
            
            sections.forEach(section => {
                const images = section.querySelectorAll('.gallery-image');
                const total = section.querySelector('.total');
                total.textContent = images.length;
                
                // Iniciar auto-slide para cada sección
                startAutoSlide(section);
            });
        }

        function startAutoSlide(section) {
            const projectName = section.dataset.project;
            
            // Limpiar intervalo existente si hay uno
            if (autoSlideIntervals.has(projectName)) {
                clearInterval(autoSlideIntervals.get(projectName));
            }
            
            // Crear nuevo intervalo
            const interval = setInterval(() => {
                changeImage(section.querySelector('.nav-arrow.next'), 1, false);
            }, 3000);
            
            autoSlideIntervals.set(projectName, interval);
        }

        function changeImage(button, direction, resetTimer = true) {
            const section = button.closest('.project-section');
            const images = section.querySelectorAll('.gallery-image');
            const backgroundImages = section.querySelectorAll('.background-image');
            const current = section.querySelector('.current');
            
            let activeIndex = 0;
            images.forEach((img, index) => {
                if (img.classList.contains('active')) {
                    activeIndex = index;
                }
            });

            // Remover clase active de imagen actual
            images[activeIndex].classList.remove('active');
            
            // Remover clase active de fondo solo si existen imágenes de fondo
            if (backgroundImages.length > 0) {
                backgroundImages[activeIndex].classList.remove('active');
            }

            // Calcular nueva imagen
            let newIndex = activeIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            // Agregar clase active a nueva imagen
            images[newIndex].classList.add('active');
            
            // Agregar clase active a fondo solo si existen imágenes de fondo
            if (backgroundImages.length > 0) {
                backgroundImages[newIndex].classList.add('active');
            }
            
            // Actualizar contador
            current.textContent = newIndex + 1;

            // Reiniciar timer si es necesario
            if (resetTimer) {
                startAutoSlide(section);
            }
        }

        // Pausar auto-slide cuando el mouse está sobre una sección
        document.querySelectorAll('.project-section').forEach(section => {
            section.addEventListener('mouseenter', () => {
                const projectName = section.dataset.project;
                if (autoSlideIntervals.has(projectName)) {
                    clearInterval(autoSlideIntervals.get(projectName));
                }
            });
            
            section.addEventListener('mouseleave', () => {
                startAutoSlide(section);
            });
        });

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', initializeGallery);
    </script>
