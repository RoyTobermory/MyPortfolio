<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Conceptual - R.Mondragon</title>
    <link rel="icon" type="image/png" href="img/Icon.png">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        /* Estilos para la galería principal */
        .main-gallery {
            position: relative;
            width: 100vw;
            height: 60vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .gallery-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .gallery-slide.active {
            opacity: 1;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            z-index: 10;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* Estilos para la galería de proyectos */
        .projects-gallery {
            width: 100vw;
            margin: 0;
            padding: 20px 0 0 0;
            background: #f5f5f5;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            margin: 0;
        }

        .project-item {
            position: relative;
            height: 300px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-item:hover {
            transform: translateY(-5px);
        }

        .project-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .project-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.2) 85%);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        .project-item:hover::after {
            opacity: 0;
        }

        .project-item:hover img {
            transform: scale(1.05);
        }

        .project-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 2;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7), 0 6px 12px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        /* Lightbox para proyectos */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .lightbox.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .lightbox-slide {
            display: none;
            width: 100%;
            height: 80vh;
        }

        .lightbox-slide.active {
            display: block;
        }

        .lightbox-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
            z-index: 1010;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .lightbox-nav.prev {
            left: 50px;
        }

        .lightbox-nav.next {
            right: 50px;
        }

        /* Hitbox grande invisible para las flechas */
        .lightbox-nav::before {
            content: '';
            position: absolute;
            top: -50px;
            bottom: -50px;
            left: -50px;
            right: -50px;
            background: transparent;
        }

        .lightbox-close {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
            z-index: 1010;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .lightbox-title {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            text-align: center;
            font-size: 1.1rem;
            border-radius: 5px;
            z-index: 1010;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-gallery {
                height: 40vh;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .project-item {
                height: 250px;
            }
            
            .gallery-nav {
                width: 20%;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- El menú se inserta automáticamente aquí -->

    <main class="main-content">
        <!-- Galería Principal -->
        <section class="main-gallery">
            <div class="gallery-container">
                <div class="gallery-slide active">
                    <img src="img/Concept/Hunt_001.jpg" alt="Hunt">
                    <div class="gallery-title">CONCEPT ART</div>
                </div>
                <div class="gallery-slide">
                    <img src="img/Concept/SM_002.jpg" alt="Sagrado Micelio">
                    <div class="gallery-title">CONCEPT ART</div>
                </div>
                <div class="gallery-slide">
                    <img src="img/Concept/Nbs_Cncpt_01.jpg" alt="Nubes">
                    <div class="gallery-title">CONCEPT ART</div>
                </div>
                <div class="gallery-slide">
                    <img src="img/BgDesign/Bg1_001.jpg" alt="Background Design">
                    <div class="gallery-title">CONCEPT ART</div>
                </div>
                <div class="gallery-slide">
                    <img src="img/Concept/SM_006.jpg" alt="Sagrado Micelio">
                    <div class="gallery-title">CONCEPT ART</div>
                </div>
            </div>
            
            <button class="gallery-nav prev" onclick="changeSlide(-1)" style="display: none;">‹</button>
            <button class="gallery-nav next" onclick="changeSlide(1)" style="display: none;">›</button>
        </section>

        <!-- Galería de Proyectos -->
        <section class="projects-gallery">
            <div class="projects-grid">
                <div class="project-item" onclick="openLightbox('sagrado-micelio')">
                    <img src="img/Concept/SM_001.jpg" alt="Sagrado Micelio">
                    <div class="project-title">Sagrado Micelio</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('nubes')">
                    <img src="img/Nubes/4.jpg" alt="Nubes">
                    <div class="project-title">Nubes</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('stupid-luv')">
                    <img src="img/Concept/SLS_001.jpg" alt="Stupid Luv Series">
                    <div class="project-title">Stupid Luv Series</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('ratan')">
                    <img src="img/BgDesign/Ratan1_001.jpg" alt="Ratán">
                    <div class="project-title">Ratán</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('robopez')">
                    <img src="img/Concept/Robopez_001.png" alt="Robopez">
                    <div class="project-title">Robopez</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('hunt')">
                    <img src="img/Concept/Hunt_001.jpg" alt="Hunt">
                    <div class="project-title">Hunt</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('cardumen')">
                    <img src="img/Concept/Crd_001.jpg" alt="Cardumen">
                    <div class="project-title">Cardumen</div>
                </div>
                
                <div class="project-item" onclick="openLightbox('animaux')">
                    <img src="img/Concept/Coco_001.jpg" alt="Animaux">
                    <div class="project-title">Animaux</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Lightboxes para cada proyecto -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            <button class="lightbox-nav prev" onclick="changeLightboxSlide(-1)">‹</button>
            <button class="lightbox-nav next" onclick="changeLightboxSlide(1)">›</button>
            <div id="lightbox-slides"></div>
            <div class="lightbox-title" id="lightbox-title"></div>
        </div>
    </div>

    <!-- El footer se inserta automáticamente aquí -->

    <script src="js/menu.js"></script>
    <script>
        // Variables globales para la galería principal
        let currentSlide = 0;
        const slides = document.querySelectorAll('.gallery-slide');
        let slideInterval;

        // Variables globales para lightbox
        let currentLightboxSlide = 0;
        let currentProject = '';
        let projectImages = {};

        // Definir las imágenes de cada proyecto
        const projects = {
            'sagrado-micelio': {
                title: 'Sagrado Micelio',
                images: []
            },
            'nubes': {
                title: 'Nubes',
                images: []
            },
            'stupid-luv': {
                title: 'Stupid Luv Series',
                images: []
            },
            'ratan': {
                title: 'Ratán',
                images: []
            },
            'robopez': {
                title: 'Robopez',
                images: ['img/Concept/Robopez_001.png', 'img/Concept/Robopez_002.png', 'img/Concept/Robopez_003.png', 'img/Concept/Robopez_004.png', 'img/Concept/Robopez_005.png']
            },
            'hunt': {
                title: 'Hunt',
                images: ['img/Concept/Hunt_001.jpg', 'img/Concept/Hunt_002.jpg']
            },
            'cardumen': {
                title: 'Cardumen',
                images: []
            },
            'animaux': {
                title: 'Animaux',
                images: ['img/Concept/Coco_001.jpg']
            }
        };

        // Generar arrays de imágenes
        // Sagrado Micelio
        for(let i = 1; i <= 9; i++) {
            projects['sagrado-micelio'].images.push(`img/Concept/SM_${i.toString().padStart(3, '0')}.jpg`);
        }

        // Nubes
        for(let i = 4; i <= 17; i++) {
            projects['nubes'].images.push(`img/Nubes/${i}.jpg`);
        }
        projects['nubes'].images.push('img/BgDesign/Bg1_001.jpg');
        for(let i = 1; i <= 4; i++) {
            projects['nubes'].images.push(`img/BgDesign/Bg2_${i.toString().padStart(3, '0')}.jpg`);
        }
        for(let i = 1; i <= 8; i++) {
            projects['nubes'].images.push(`img/BgDesign/Bg3_${i.toString().padStart(3, '0')}.jpg`);
        }

        // Stupid Luv Series
        for(let i = 1; i <= 13; i++) {
            projects['stupid-luv'].images.push(`img/Concept/SLS_${i.toString().padStart(3, '0')}.jpg`);
        }

        // Ratán
        for(let i = 1; i <= 2; i++) {
            projects['ratan'].images.push(`img/BgDesign/Ratan1_${i.toString().padStart(3, '0')}.jpg`);
        }
        for(let i = 1; i <= 5; i++) {
            projects['ratan'].images.push(`img/BgDesign/Ratan2_${i.toString().padStart(3, '0')}.jpg`);
        }
        for(let i = 1; i <= 2; i++) {
            projects['ratan'].images.push(`img/BgDesign/Ratan3_${i.toString().padStart(3, '0')}.jpg`);
        }

        // Cardumen
        for(let i = 1; i <= 4; i++) {
            projects['cardumen'].images.push(`img/Concept/Crd_${i.toString().padStart(3, '0')}.jpg`);
        }

        // Funciones para la galería principal
        function showSlide(n) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
            resetInterval();
        }

        function autoSlide() {
            showSlide(currentSlide + 1);
        }

        function startInterval() {
            slideInterval = setInterval(autoSlide, 4500);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            startInterval();
        }

        // Funciones para lightbox
        function openLightbox(projectKey) {
            currentProject = projectKey;
            currentLightboxSlide = 0;
            const project = projects[projectKey];
            
            document.getElementById('lightbox-title').textContent = project.title;
            
            const slidesContainer = document.getElementById('lightbox-slides');
            slidesContainer.innerHTML = '';
            
            project.images.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = `lightbox-slide ${index === 0 ? 'active' : ''}`;
                slide.innerHTML = `<img src="${src}" alt="${project.title}">`;
                slidesContainer.appendChild(slide);
            });
            
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function changeLightboxSlide(direction) {
            const project = projects[currentProject];
            const lightboxSlides = document.querySelectorAll('#lightbox-slides .lightbox-slide');
            
            lightboxSlides[currentLightboxSlide].classList.remove('active');
            currentLightboxSlide = (currentLightboxSlide + direction + project.images.length) % project.images.length;
            lightboxSlides[currentLightboxSlide].classList.add('active');
        }

        // Cerrar lightbox al hacer clic fuera del contenido
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Navegación con teclado
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('lightbox').classList.contains('active')) {
                switch(e.key) {
                    case 'Escape':
                        closeLightbox();
                        break;
                    case 'ArrowLeft':
                        changeLightboxSlide(-1);
                        break;
                    case 'ArrowRight':
                        changeLightboxSlide(1);
                        break;
                }
            } else {
                switch(e.key) {
                    case 'ArrowLeft':
                        changeSlide(-1);
                        break;
                    case 'ArrowRight':
                        changeSlide(1);
                        break;
                }
            }
        });

        // Inicializar la galería principal
        startInterval();

        // Pausar la galería cuando el usuario está navegando
        document.querySelector('.main-gallery').addEventListener('mouseenter', () => {
            clearInterval(slideInterval);
        });

        document.querySelector('.main-gallery').addEventListener('mouseleave', () => {
            startInterval();
        });
    </script>
</body>
</html>
