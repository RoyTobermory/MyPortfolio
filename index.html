<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.Mondragon</title>
    <link rel="icon" type="image/png" href="img/Icon.png">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .welcome-screen {
            min-height: 100vh;
            background: linear-gradient(45deg, #7bafbd 0%, #6496a6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .welcome-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('img/Forest-background2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.7;
            z-index: 0;
        }

        .welcome-content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .option-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            padding: 30px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .option-card:hover .image-container {
            transform: scale(1.1);
        }

        .image-container {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .option-text {
            font-size: 1rem;
            color: white;
            text-align: center;
            line-height: 1.4;
            font-weight: bold;
            max-width: 140px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Estilos especiales para el logo (Quién es Rodrigo) */
        .logo-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            padding: 30px 20px;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-card:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo-card:hover .logo-container {
            transform: scale(1.1);
        }

        .special-logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .special-logo-hover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .logo-card:hover .special-logo-image {
            opacity: 0;
        }

        .logo-card:hover .special-logo-hover {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .options-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 40px 30px;
                max-width: 800px;
            }
        }

        @media (max-width: 768px) {
            .welcome-screen {
                padding: 40px 20px;
            }
            
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
                max-width: 500px;
            }
            
            .image-container, .logo-container {
                width: 80px;
                height: 80px;
            }
            
            .option-text {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 25px;
                max-width: 300px;
            }
            
            .option-card, .logo-card {
                padding: 25px 15px;
            }
            
            .image-container, .logo-container {
                width: 70px;
                height: 70px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <main class="welcome-screen">
        <div class="welcome-content">
            <div class="options-grid">
                <a href="3d.html" class="option-card">
                    <div class="image-container">
                        <img src="img/PersefoneIcon.png" alt="3D" class="card-image">
                    </div>
                    <div class="option-text">3D</div>
                </a>
                
                <a href="concept-art.html" class="option-card">
                    <div class="image-container">
                        <img src="img/ChurroIcono2.png" alt="Concept Art" class="card-image">
                    </div>
                    <div class="option-text">Concept Art</div>
                </a>
                
                <a href="diseño.html" class="option-card">
                    <div class="image-container">
                        <img src="img/LadJitsuIcono.png" alt="Diseño" class="card-image">
                    </div>
                    <div class="option-text">Diseño</div>
                </a>
                
                <a href="sobre-mi.html" class="logo-card">
                    <div class="logo-container">
                        <img src="img/Logo.png" alt="Logo especial" class="special-logo-image">
                        <img src="img/LogoHover.png" alt="Logo Hover especial" class="special-logo-hover">
                    </div>
                    <div class="option-text">¿Quién es<br>Rodrigo Mondragón?</div>
                </a>
                
                <a href="https://linktr.ee/roy.mondragon" target="_blank" class="option-card">
                    <div class="image-container">
                        <img src="img/LinktreeLogo.png" alt="Linktree Logo" class="card-image">
                    </div>
                    <div class="option-text">Linktree</div>
                </a>
            </div>
        </div>
    </main>

    <!-- El footer se inserta automáticamente aquí -->
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.option-card, .logo-card');
            
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
